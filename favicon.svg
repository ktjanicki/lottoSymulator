<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Złota kula jak .logo w nagłówku (kolory gold ze style.css). Cyfra
       to kontur „6” z Inter 800 (fonts/, ta sama co w nagłówku) zapisany
       ścieżką, nie <text>: ikona karty nie wczytuje czcionek strony, więc
       tekst dostałby krój systemu i wyglądał inaczej w każdym. Cyfra jest
       większa niż w nagłówku (34 z 64, nie 21,5) — przy 16 px mniejsza
       zlewa się w plamę. -->
  <defs>
    <radialGradient id="ball" cx="0.34" cy="0.28" r="0.78">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#ball)"/>
  <!-- Ciemniejszy brzeg: bez niego jasna kula zlewa się z jasnym paskiem kart. -->
