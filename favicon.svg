<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Złota kula jak .logo w nagłówku (kolory gold ze style.css). Cyfra
       rysowana ścieżką, nie <text>: ikona karty nie wczytuje czcionek strony,
       więc tekst dostałby krój systemu i wyglądał inaczej w każdym. -->
  <defs>
    <radialGradient id="ball" cx="0.34" cy="0.28" r="0.78">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#ball)"/>
  <!-- Ciemniejszy brzeg: bez niego jasna kula zlewa się z jasnym paskiem kart. -->
  <circle cx="32" cy="32" r="30.25" fill="none" stroke="#b45309" stroke-opacity="0.55" stroke-width="1.5"/>
  <g fill="none" stroke="#1f1500" stroke-width="6.5" stroke-linecap="round">
    <circle cx="32" cy="40" r="10"/>
    <path d="M22 40C22 26 28 17 39 15"/>
  </g>
</svg>
